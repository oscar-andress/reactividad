name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the reactividad-reviewer agent to review this pull request's diff
            against the base branch, following its checklist (exception wiring,
            circuit breaker fallback compatibility, auth fail-closed default,
            manual mapper completeness, reactive correctness, repository naming
            traps, schema/fixture sync, test coverage, and the full ./mvnw test
            suite passing with zero errors). Post the findings as inline PR
            comments grouped by severity, ending with a pass/fail summary line.
          claude_args: "--max-turns 15"
